<div class="hero-section">
    <div class="hero-overlay">
        <div class="hero-container">
            <div class="hero-content">
                <h1>{{ 'hero.header' | translate }}</h1>
                <p>{{ 'hero.paragraph' | translate }}</p>

                <div class="hero-stats">
                    <div class="stat-item">
                        <span class="stat-number"
                              [countUp]="stats().totalBooks"
                              [countUpOptions]="{ duration: 2, useEasing: true, suffix: '+' }">0</span>
                        <span class="stat-label">{{ 'hero.books' | translate }}</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-number"
                              [countUp]="stats().totalAuthors"
                              [countUpOptions]="{ duration: 2, useEasing: true, suffix: '+' }">0</span>
                        <span class="stat-label">{{ 'hero.authors' | translate }}</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-number"
                              [countUp]="stats().totalPublishers"
                              [countUpOptions]="{ duration: 2, useEasing: true, suffix: '+' }">0</span>
                        <span class="stat-label">{{ 'hero.publishers' | translate }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
