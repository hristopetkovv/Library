<nz-tabs nzCentered
         [(nzSelectedIndex)]="tabIndex"
         nzSize="large">

    <nz-tab nzTitle="{{ 'auth.loginTitle' | translate }}">
        <app-login (onLoginSuccess)="closeModal()"
                   (onForgot)="handleForgot()"></app-login>
    </nz-tab>

    <nz-tab nzTitle="{{ 'auth.registerTitle' | translate }}">
        <app-register (onRegisterSuccess)="handleRegisterSuccess($event)"></app-register>
    </nz-tab>

</nz-tabs>
