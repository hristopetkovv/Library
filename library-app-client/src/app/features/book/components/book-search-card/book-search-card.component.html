<div class="book-card" (click)="onClick()"
   class="book-card">

    <div class="book-cover">
        @if (book().coverImageUrl) {
        <img [src]="book().coverImageUrl"
             [alt]="book().title"
             class="cover-img" />
        } @else {
        <div class="cover-placeholder"
             [style.background]="placeholderColor() + '18'">
            <div class="cover-icon"
                 [style.border-left-color]="placeholderColor()"
                 [style.background]="placeholderColor() + '22'">
                <svg viewBox="0 0 24 24"
                     [style.fill]="placeholderColor()"
                     xmlns="http://www.w3.org/2000/svg">
                    <path
                          d="M4 2h14a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v16h14V4H4zm2 2h10v2H6V6zm0 4h10v2H6v-2zm0 4h7v2H6v-2z" />
                </svg>
            </div>
            <span class="cover-initials"
                  [style.color]="placeholderColor()">{{ initials() }}</span>
        </div>
        }

        <span class="availability-badge"
              [class.available]="isAvailable()"
              [class.unavailable]="!isAvailable()">
            {{ (isAvailable() ? 'book.available' : 'book.unavailable') | translate }}
        </span>
    </div>

    <div class="book-info">
        <p class="book-title"
           nz-tooltip
           [nzTooltipTitle]="book().title">{{ book().title }}</p>
        <p class="book-author">{{ book().authorName }}</p>
    </div>

</div>
