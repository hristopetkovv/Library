<form nz-form
      [formGroup]="form"
      nzLayout="vertical"
      (ngSubmit)="onSubmit()">

    <nz-form-item>
        <nz-form-label nzRequired>{{ 'admin.publisher.name' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="nameError">
            <input nz-input
                   formControlName="name" />
            <ng-template #nameError
                         let-control>
                @if (control.errors?.['required']) { {{ 'validation.required' | translate }} }
                @else if (control.errors?.['maxlength']) { {{ 'validation.maxLength' | translate: { max: 255 } }} }
            </ng-template>
        </nz-form-control>
    </nz-form-item>

    <div class="form-footer">
        <button nz-button
                nzType="default"
                type="button"
                (click)="onCancel()">
            {{ 'common.cancel' | translate }}
        </button>
        <button nz-button
                nzType="primary"
                type="submit"
                [nzLoading]="isSubmitting()"
                class="submit-btn">
            {{ (isEditMode() ? 'common.save' : 'common.create') | translate }}
        </button>
    </div>

</form>
