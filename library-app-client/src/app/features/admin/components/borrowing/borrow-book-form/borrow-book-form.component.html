<form nz-form
      [formGroup]="form"
      nzLayout="vertical"
      (ngSubmit)="onSubmit()">
    <nz-form-item>
        <nz-form-label nzRequired>{{ 'admin.borrowing.book' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="'validation.required' | translate">
            <nz-select formControlName="bookId"
                       nzShowSearch
                       nzAllowClear>
                @for (book of books(); track book.id) {
                <nz-option [nzValue]="book.id"
                           [nzLabel]="book.title"></nz-option>
                }
            </nz-select>
        </nz-form-control>
    </nz-form-item>

    <nz-form-item>
        <nz-form-label nzRequired>{{ 'admin.borrowing.user' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="'validation.required' | translate">
            <nz-select formControlName="userId"
                       nzShowSearch
                       nzAllowClear>
                @for (user of users(); track user.id) {
                <nz-option [nzValue]="user.id"
                           [nzLabel]="user.email"></nz-option>
                }
            </nz-select>
        </nz-form-control>
    </nz-form-item>

    <div class="form-footer">
        <button nz-button
                nzType="default"
                type="button"
                (click)="onCancel()">
            {{ 'common.cancel' | translate }}
        </button>
        <button nz-button
                nzType="primary"
                type="submit"
                [nzLoading]="isSubmitting()">
            {{ 'common.save' | translate }}
        </button>
    </div>
</form>
