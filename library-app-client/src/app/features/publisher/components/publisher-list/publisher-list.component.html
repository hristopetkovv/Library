<div class="page-layout">

  <aside class="sidebar">
    <app-publisher-filters (filterChange)="onFilterChange($event)"></app-publisher-filters>
  </aside>

  <main class="content">

    <div class="toolbar">
      <span class="result-count">
        <strong>{{ totalPublishers() }}</strong> {{ 'publisher.list.publishersFound' | translate }}
      </span>
      <app-sort-select [options]="sortOptions"
                       [value]="sortBy()"
                       (valueChange)="onSortChange($event)"></app-sort-select>
    </div>

    @if (isLoading()) {
    <app-loading message="{{ 'common.loading' | translate }}" />
    } @else if (totalPublishers() === 0) {
    <div class="empty-state">
      <nz-empty nzNotFoundContent="{{ 'publisher.list.empty' | translate }}"></nz-empty>
    </div>
    } @else {
    <div class="publishers-grid">
      @for (publisher of pagedPublishers(); track publisher.id) {
      <app-publisher-card [publisher]="publisher"
                          (cardClick)="onPublisherClick($event)"></app-publisher-card>
      }
    </div>
    }

    @if (totalPublishers() > pageSize()) {
    <div class="pagination-wrapper">
      <nz-pagination [nzTotal]="totalPublishers()"
                     [nzPageIndex]="pageIndex()"
                     [nzPageSize]="pageSize()"
                     [nzShowSizeChanger]="false"
                     (nzPageIndexChange)="onPageChange($event)"></nz-pagination>
    </div>
    }

  </main>

</div>
