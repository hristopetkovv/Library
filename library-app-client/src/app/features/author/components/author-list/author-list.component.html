<div class="page-layout">

  <aside class="sidebar">
    <app-author-filters (filterChange)="onFilterChange($event)"></app-author-filters>
  </aside>

  <main class="content">

    <div class="toolbar">
      <span class="result-count">
        <strong>{{ totalAuthors() }}</strong> {{ 'author.list.authorsFound' | translate }}
      </span>
      <app-sort-select [options]="sortOptions"
                       [value]="sortBy()"
                       (valueChange)="onSortChange($event)"></app-sort-select>
    </div>

    @if (isLoading()) {
    <app-loading message="{{ 'common.loading' | translate }}" />
    } @else if (totalAuthors() === 0) {
    <div class="empty-state">
      <nz-empty nzNotFoundContent="{{ 'author.empty' | translate }}"></nz-empty>
    </div>
    } @else {
    <div class="authors-grid">
      @for (author of pagedAuthors(); track author.id) {
      <app-author-card [author]="author"
                       (cardClick)="onAuthorClick($event)"></app-author-card>
      }
    </div>
    }

    @if (totalAuthors() > pageSize()) {
    <div class="pagination-wrapper">
      <nz-pagination [nzTotal]="totalAuthors()"
                     [nzPageIndex]="pageIndex()"
                     [nzPageSize]="pageSize()"
                     [nzShowSizeChanger]="false"
                     (nzPageIndexChange)="onPageChange($event)"></nz-pagination>
    </div>
    }

  </main>

</div>
