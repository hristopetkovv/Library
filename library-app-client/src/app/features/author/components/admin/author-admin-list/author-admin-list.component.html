<div class="admin-header">
    <h2 class="admin-title">{{ 'admin.author.title' | translate }}</h2>
    <button nz-button
            nzType="primary"
            class="create-btn"
            (click)="openCreateModal()">
        <span nz-icon
              nzType="plus"></span>
        {{ 'admin.author.create' | translate }}
    </button>
</div>

@if (isLoading()) {
<app-loading />
} @else {
<nz-table #table
          [nzData]="authors()"
          [nzPageSize]="20"
          nzSize="middle"
          style="margin-top: 3em">
    <thead>
        <tr>
            <th>{{ 'admin.author.nameCol' | translate }}</th>
            <th nzWidth="120px">{{ 'admin.author.booksCount' | translate }}</th>
            <th nzWidth="110px"
                nzRight>{{ 'common.actions' | translate }}</th>
        </tr>
    </thead>
    <tbody>
        @for (author of table.data; track author.id) {
        <tr>
            <td>
                <span class="author-title">{{ author.name }}</span>
            </td>
            <td>
                <nz-tag>{{ author.booksCount }}</nz-tag>
            </td>
            <td nzRight>
                <div class="action-btns">
                    <button nz-button
                            nzType="text"
                            nzSize="small"
                            (click)="openEditModal(author.id)">
                        <span nz-icon
                              nzType="edit"></span>
                    </button>
                    <button nz-button
                            nzType="text"
                            nzSize="small"
                            nzDanger
                            nz-popconfirm
                            nzPopconfirmTitle="{{ 'admin.author.deleteConfirm' | translate }}"
                            nzPopconfirmPlacement="left"
                            (nzOnConfirm)="deleteAuthor(author.id)">
                        <span nz-icon
                              nzType="delete"></span>
                    </button>
                </div>
            </td>
        </tr>
        }
    </tbody>
</nz-table>
}
